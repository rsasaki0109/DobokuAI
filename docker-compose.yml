services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    init: true
    environment:
      API_BIND: 0.0.0.0:3001
      DATABASE_PATH: /data/doboku.sqlite
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - river-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  river-data:
